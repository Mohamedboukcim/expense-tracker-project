spring:
  application:
    name: expense-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expense_tracker}
    username: ${DB_USER:expense_user}
    password: ${DB_PASSWORD:expense_pass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
jwt:
  secret: ${JWT_SECRET:ceci-est-une-cle-secrete-de-developpement-a-ne-jamais-utiliser-en-production-changez-moi}
  expiration-ms: 86400000