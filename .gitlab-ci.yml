image: maven:3.9-eclipse-temurin-21

stages:
  - test
  - build

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  POSTGRES_DB: expense_tracker_test
  POSTGRES_USER: expense_user
  POSTGRES_PASSWORD: expense_pass
  DB_URL: jdbc:postgresql://postgres:5432/expense_tracker_test
  DB_USER: expense_user
  DB_PASSWORD: expense_pass
  RABBIT_HOST: rabbitmq

cache:
  paths:
    - .m2/repository

test:
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: rabbitmq:3-management-alpine
      alias: rabbitmq
  script:
    - mvn test -B

build:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  script:
    - docker build -t expense-tracker:$CI_COMMIT_SHORT_SHA .
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'